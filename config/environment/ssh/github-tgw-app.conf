Host github-tgw-app
    HostName github.com
    HostKeyAlias github.com
    User git
    Port 22
    IdentityAgent /run/tgw-github-agent/agent.sock
    IdentityFile /etc/ssh/tgw_github_app.pub
    IdentitiesOnly yes
    BatchMode yes
    StrictHostKeyChecking yes
    GlobalKnownHostsFile /etc/ssh/tgw_github_known_hosts
    UserKnownHostsFile /dev/null
    ForwardAgent no
    AddKeysToAgent no
    PasswordAuthentication no
    KbdInteractiveAuthentication no
