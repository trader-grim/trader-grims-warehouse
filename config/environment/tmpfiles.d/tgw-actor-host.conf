# W15 tgw-lib actor-host layout. These are durable attempt roots, never /tmp
# or an actor home. The setgid bit keeps newly allocated attempt directories
# in the explicit tgw-coders filesystem capability group.
d /opt/TGW/w/attempts 2770 root tgw-coders -
d /opt/TGW/var/cache/tgw/attempts 2770 root tgw-coders -
d /opt/TGW/tgw-lib/config 0750 root tgw-coders -
d /opt/TGW/tgw-lib/actor-runtime 0755 root root -
d /opt/TGW/tgw-lib/actor-runtime/releases 0755 root root -
d /opt/TGW/tgw-lib/actor-runtime/admissions 0755 root root -
d /opt/TGW/tgw-lib/actor-runtime/actor-generations 0755 root root -
d /opt/TGW/tgw-lib/var/host-bootstrap-receipts 0750 root tgw-coders -
d /opt/TGW/tgw-lib/var/fleet 0750 root tgw-coders -
d /etc/tgw/trust 0755 root root -
d /etc/tgw/actors 0755 root root -
