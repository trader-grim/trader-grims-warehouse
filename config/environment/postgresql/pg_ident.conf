# TGW universal development database peer map (pg_ident.conf).
#
# Every ordinary Unix member of tgw-coders reaches PostgreSQL through the
# single tgw_coding execution role.  The shared development DSNs name
# user=tgw_coding explicitly; peer authentication then resolves the invoking
# Unix identity through this map.
#
# The map covers every tgw-coders member with a real login shell.  Service
# accounts with nologin shells (for example tgw-git, tgw-release, and the
# confined tgw-coder session identity, which never opens a database
# connection) are not ordinary coding actors and are intentionally absent.
# Onboarding a new harness updates this map (plus tgw-coders membership) and
# never creates another PostgreSQL login role.  The Doctor check
# database.local-coding-peer-auth enforces this in both directions.
#
# PP-ROLES-001 WU-4 (2026-09-08): the AI-fleet accounts tigwadev, hermaroid,
# hermes, and prime were pruned from tgw-coders and this map.  hermaroid/prime
# had no live use; hermes keeps its own tgw-recovery break-glass lane; tigwadev
# was still serving context-MCP/model-canary sessions and was removed on
# explicit operator direction, with those paths to re-home onto a service
# identity.  opencode is retained: it is the wired model-probe / planned coding
# executor account referenced by config/model-availability.json and
# config/tgw-coding-executors.json.  db is retained until the WU-3
# db->tgw-harness sweep completes.
#
# The separate database owner/admin role is preserved untouched.
#
# MAPNAME       SYSTEM-USERNAME         PG-USERNAME
tgw-coders      db                      tgw_coding
tgw-coders      codex                   tgw_coding
tgw-coders      claude                  tgw_coding
tgw-coders      deepseek                tgw_coding
tgw-coders      opencode                tgw_coding
tgw-coders      tgw-harness             tgw_coding
