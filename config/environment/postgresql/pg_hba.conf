# TGW canonical PostgreSQL host authentication (pg_hba.conf).
#
# Reference layout for the local Debian 17 cluster on tgw-lib.  The managed
# peer line for the universal tgw_coding execution role MUST precede any
# broader ``local ... all ... peer`` line so every ordinary tgw-coders Unix
# identity resolves through the tgw-coders pg_ident map.  Doctor verifies and
# repairs this ordering idempotently; other lines are preserved byte-for-byte.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             tgw_coding      peer map=tgw-coders
local   all             all                                     peer
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
