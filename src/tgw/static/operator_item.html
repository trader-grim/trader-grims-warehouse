<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGW Item</title><style>
body{font:16px system-ui,sans-serif;background:#101216;color:#e5e7eb;margin:0;padding:1.2rem}main{max-width:70rem;margin:auto}.card{border:1px solid #46505f;border-radius:.6rem;padding:1rem;margin:1rem 0;background:#181c22}.meta{font:13px ui-monospace,monospace;color:#aab2bf;overflow-wrap:anywhere}.held{color:#f2d68a}.error{color:#ff9b9b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:.8rem}label{display:block;color:#cbd5e1}input,select{box-sizing:border-box;width:100%;margin-top:.25rem;padding:.6rem;border:1px solid #46505f;border-radius:.35rem;background:#101216;color:#e5e7eb}button{padding:.65rem 1rem;margin:.25rem;border:1px solid #5f8fc9;border-radius:.35rem;background:#234263;color:white}button:disabled{opacity:.45}pre{white-space:pre-wrap;overflow-wrap:anywhere}.reason{font-size:.85rem;color:#f2d68a}
</style></head><body><main><p><a href="/form/items" style="color:#9fc3e8">← Inventory</a></p><section id="item" class="card">Loading canonical item object…</section></main>
<script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sku=decodeURIComponent(location.pathname.split('/').pop());let current=null;
function fieldControls(object){const schema=object.field_schema||{},condition=schema.condition||{},aspects=schema.aspects||[];let html='<div class="grid">';html+=`<label>Condition<select id="condition_enum">${(condition.options||[]).map(x=>`<option value="${esc(x.value)}" ${x.value===condition.value?'selected':''}>${esc(x.label)}</option>`).join('')}</select></label>`;html+=aspects.map((x,i)=>{const id=`aspect-${i}`,values=x.allowed_values||[];return `<label>${esc(x.name)}${x.required?' *':''}${values.length?`<select id="${id}" data-aspect="${esc(x.name)}"><option value=""></option>${values.map(v=>`<option value="${esc(v)}" ${v===x.value?'selected':''}>${esc(v)}</option>`).join('')}</select>`:`<input id="${id}" data-aspect="${esc(x.name)}" value="${esc(x.value||'')}">`}</label>`}).join('');return html+'</div>'}
function commandValues(){const values={condition_enum:document.getElementById('condition_enum')?.value||'',item_specifics:{}};document.querySelectorAll('[data-aspect]').forEach(x=>{values.item_specifics[x.dataset.aspect]=x.value});return values}
async function submitCommand(id){const result=document.getElementById('result');result.textContent='Submitting exact command…';const response=await fetch(`/api/operator/items/${encodeURIComponent(sku)}/commands`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command_id:id,object_generation:current.object_generation,values:commandValues()})});const body=await response.json().catch(()=>({}));if(!response.ok){result.textContent=`Held: ${typeof body.detail==='string'?body.detail:JSON.stringify(body.detail)}`;await load();return}result.textContent=`Accepted: ${id}; job ${body.job_id||'already satisfied'}`;await load()}
function render(object){current=object;const workflow=object.workflow||{},item=(object.item||{}).record||{},listing=object.listing||{};document.title=`TGW ${object.entity_id}`;document.getElementById('item').innerHTML=`<h1>${esc(item.title||object.entity_id)}</h1><p class="meta">${esc(object.entity_id)} · generation ${esc(object.object_generation)}</p><p><b>Workflow:</b> ${esc(workflow.state)}</p><p class="held">${esc((workflow.reasons||[]).join(' · '))}</p><h2>Provider state</h2><pre>${esc(JSON.stringify({provider_state:listing.provider_state,offer:listing.offer,listing:listing.listing},null,2))}</pre><h2>Server-published fields</h2>${fieldControls(object)}<h2>Legal commands</h2><div>${(object.commands||[]).map(c=>`<button data-command="${esc(c.id)}" ${c.enabled?'':'disabled'}>${esc(c.label)}</button><span class="reason">${esc(c.reason||'')}</span>`).join('<br>')}</div><p id="result" class="meta"></p><h2>Evidence</h2><p class="meta">${esc((workflow.evidence||[]).join(' · '))}</p>`;document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',()=>submitCommand(button.dataset.command)))}
async function load(){const response=await fetch(`/api/operator/items/${encodeURIComponent(sku)}`);const body=await response.json().catch(()=>({}));if(!response.ok){document.getElementById('item').innerHTML=`<p class="error">Canonical object unavailable: ${esc(body.detail||response.statusText)}</p>`;return}render(body.object)}load();
</script></body></html>
