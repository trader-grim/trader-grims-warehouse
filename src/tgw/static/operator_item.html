    function currentAspectValues(){const values={};document.querySelectorAll("[data-aspect]").forEach(element=>{values[element.dataset.aspect]={value:element.value,initial_value:initialValue(element)}});return values}
    function mergedAspects(contextAspects){

      const merged=(contextAspects||[]).map(aspect=>{seen.add(aspect.name);const prior=publishedByName.get(aspect.name)||{},entry=entered[aspect.name];return {...prior,...aspect,value:entry?entry.value:(aspect.value??prior.value),initial_value:entry?entry.initial_value:(Object.hasOwn(prior,"initial_value")?prior.initial_value:aspectValue(prior))}});
      published.filter(aspect=>!seen.has(aspect.name)&&[aspect.value,aspect.inventory_value,aspect.live_value,aspect.proposed_value].some(value=>value!==null&&value!==undefined&&value!=="")).forEach(aspect=>{const entry=entered[aspect.name];merged.push({...aspect,category_defined:false,custom:true,value:entry?entry.value:aspect.value,initial_value:entry?entry.initial_value:(Object.hasOwn(aspect,"initial_value")?aspect.initial_value:aspectValue(aspect))})});

    }
    async function refreshCategoryContext(control,categoryId,label="",path=""){
      const status=control.querySelector("[data-category-status]"),template=control.dataset.contextEndpoint,request=(control._categoryContextRequest||0)+1,persistedLabel=label||control.dataset.categorySelectionLabel||"",persistedPath=path||control.dataset.categorySelectionPath||"";control._categoryContextRequest=request;if(!categoryId){updateCategorySelection(control,"", "", "");status.textContent="No category selected";return}updateCategorySelection(control,categoryId,persistedLabel,persistedPath);if(!template){status.textContent="Category selected";return}

        if(!response.ok||body.ok===false)throw new Error(body.detail||response.statusText);

    function dataNavigation(object){
      const entries=object.presentation?.data_navigation||[];
      if(!entries.length)return "";
      return `<nav class="data-navigation" aria-label="Item data sections">${entries.map(entry=>`<a href="#${esc(encodeURIComponent(String(entry.target||"")))}">${esc(entry.label)}</a>`).join("")}</nav>`;
    }
    const componentRegistry={
      "media":{render:mediaGallery},
      "provider-media":{render:providerMedia},
      "attention-banner":{render:renderAttention},
      "alerts":{render:renderAlerts},
      "inventory-editor":{render:inventoryEditor},
      "listing-editor":{render:listingEditor},
      "pricing-context":{render:pricingContext,sectionIds:object=>object.presentation?.pricing_context?.details_sections||[]},
      "data-navigation":{render:dataNavigation},
      "commands":{render:commandControls},
    };
    function componentName(component){return typeof component==="string"?component:component?.type}
    function normaliseRegions(view){return Array.isArray(view.regions)?view.regions:[]}
    function renderRegion(object,region,sections,view){
      const names=(region.components||[]).map(componentName).filter(Boolean),consumed=new Set();
      names.forEach(name=>(componentRegistry[name]?.sectionIds?.(object)||[]).forEach(id=>consumed.add(id)));
      const context={region,sections,view};

    }

    }
    function itemHeader(object,view){
      const presentation=object.presentation||{},header=presentation.header||{},facts=header.facts||[];
      const lead=header.lead||facts.find(fact=>fact.id==="title")||{value:presentation.title||object.entity_id,format:"text"};
      const trail=Array.isArray(header.trail)?header.trail:facts.filter(fact=>fact.id!==lead.id&&!fact.tone);
      const status=header.status||facts.find(fact=>fact.tone),statuses=Array.isArray(header.statuses)&&header.statuses.length?header.statuses:(status?[status]:[]);
      const trailHtml=trail.map(fact=>`<span class="header-trail-value">${formatValue(fact.value,fact.format,fact.href)}</span>`).join("");
      const statusHtml=statuses.map(entry=>{const details=[...(entry.reasons||[]),...(entry.evidence||[])].join(" · ");return `<span class="header-status ${esc(cssToken(entry.tone))}" data-status-label="${esc(entry.label||"")}" title="${esc(details||entry.label||"")}">${formatValue(entry.value,entry.format,entry.href)}</span>`}).join("");

      const breadcrumbHtml=breadcrumbs.map((entry,index)=>{const label=typeof entry==="string"?entry:entry.label,href=typeof entry==="object"&&entry?entry.href:null,external=typeof entry==="object"&&entry?.external;const content=href?`<a class="${index===0?"brand":"crumb"}" href="${esc(safeHref(href))}" ${external?'target="_blank" rel="noopener"':""}>${esc(label)}</a>`:`<span>${esc(label)}</span>`;return `${index?'<span class="breadcrumb-separator">/</span>':""}${content}`}).join("");

    }
    function viewNav(views){return `<nav class="view-nav" aria-label="Item views">${views.map(view=>`<a href="?view=${encodeURIComponent(view.id)}" data-view="${esc(view.id)}" class="${view.id===selectedView?"active":""}">${esc(view.label)}</a>`).join("")}</nav>`}
    function previewPhoto(element,object){
      const main=document.getElementById("main-photo"),caption=document.getElementById("media-caption"),container=document.getElementById("gallery-main");
      if(!main||!container)return;

    }
    function bindInteractions(object){

    function render(object){

    async function load(){const response=await fetch(`/api/operator/items/${encodeURIComponent(sku)}`);const body=await response.json().catch(()=>({}));if(!response.ok){document.getElementById("app").innerHTML=`<div class="loading error">Current item unavailable: ${esc(body.detail||response.statusText)}</div>`;return}render(body.object)}
