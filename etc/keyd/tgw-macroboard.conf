# =============================================================================
# TGW Macroboard — keyd configuration
# =============================================================================
#
# TARGET DEVICE: Dell USB Keyboard (413c:2105)
#
# IMPORTANT — Multiple identical keyboards:
#   If you have more than one 413c:2105 keyboard, keyd cannot distinguish
#   them by vendor:product alone. To target only the physical macroboard:
#
#     1. Run: keyd list-devices
#     2. Find the entry for the macroboard (by USB port/path)
#     3. Replace "413c:2105" below with the unique ID shown, e.g.:
#          "413c:2105:a1b2c3d4e5f6"  (includes serial/path hash)
#
# LAYER DESIGN:
#   Base layer: normal keyboard (Caps Lock enters tgw_layer)
#   tgw_layer:  every alpha/number key runs a TGW macro
#               Highlight a SKU/location → press macro key
#               No selection → uses /opt/TGW/CurrentItem
#               ESC / Caps Lock → return to normal
#
# SUB-LAYER NOTE:
#   This macroboard layer is designed to eventually become a sub-layer
#   available on ALL keyboards (tap a chord to activate from any board).
#   The tgw_layer definitions here are the canonical source for that.
#
# MACRO SCRIPT: /opt/TGW/bin/tgw-macro  (dispatcher)
# LAUNCHER:     /opt/TGW/bin/tm         (sets env, runuser -u tgw)
# =============================================================================

[ids]
413c:2105

# ---------------------------------------------------------------------------
# Base layer — normal keyboard, Caps Lock activates TGW layer
# ---------------------------------------------------------------------------

[main]
capslock = toggle(tgw_layer)

# ---------------------------------------------------------------------------
# TGW Macro Layer
# All alpha/number keys run macros. Clipboard → arg; CurrentItem if empty.
#
# KEY MAP (mnemonic):
#
#   ITEM INFO & FIELDS
#   g = Get item summary → notification
#   t = Title update (prompt)
#   l = Location update (prompt)
#   v = Verified (mark in-stock + verified today)
#   h = Hint (set ai_hint → requeue identify, prompt)
#   u = set cUrrent item (set CurrentItem symlink to selection)
#
#   OPEN / VIEW
#   o = Open item folder (Dolphin)
#   i = Images (gwenview)
#   j = Json edit (konsole + nano)
#
#   EBAY BROWSER
#   e = Ebay search by SKU (Seller Hub)
#   b = Browse listing by item number (ebay.com/itm)
#   shift+e = Edit listing on eBay (revise form)
#   f = Find comparable sold listings (research)
#   shift+s = Seller hub overview
#
#   PIPELINE (in order 1–5)
#   1 = stage 1: ai_identify
#   2 = stage 2: ebay_draft
#   3 = stage 3: ebay_price
#   4 = stage 4: ebay_stage
#   5 = stage 5: publish
#   p = Publish staged item (same as 5)
#
#   PICKLIST
#   a = Add picklist line → clipboard
#   shift+a = Add picklist Question line → clipboard
#
#   LOCATION BULK
#   m = Move all items at location (prompt for destination)
#   shift+l = open Location folder (Dolphin)
#
#   ADMIN / SYSTEM
#   k = health checK → notification
#   q = Queue depths → notification
#   c = Catalog rebuild (enqueue)
#   d = staged list (stageD items)
#   w = Weight (USB scale → clipboard)
#   y = dictation (whispY, 15s)
#   z = short dictation (7s)
#   x = suggest (appends to planning inbox, prompt)
#   r = Requeue no-draft items
#
#   NAVIGATION pass-through (ESC/enter/arrows/F-keys work normally)
# ---------------------------------------------------------------------------

[tgw_layer]

# --- exit ---
capslock = toggle(tgw_layer)
esc = toggle(tgw_layer)

# --- item info & fields ---
g = command(/opt/TGW/bin/tm get)
t = command(/opt/TGW/bin/tm title)
l = command(/opt/TGW/bin/tm location)
v = command(/opt/TGW/bin/tm verified)
h = command(/opt/TGW/bin/tm hint)
u = command(/opt/TGW/bin/tm set)

# --- open / view ---
o = command(/opt/TGW/bin/tm open)
i = command(/opt/TGW/bin/tm images)
j = command(/opt/TGW/bin/tm json)

# --- ebay browser ---
e = command(/opt/TGW/bin/tm ebay-sku)
b = command(/opt/TGW/bin/tm ebay-view)
shift+e = command(/opt/TGW/bin/tm ebay-edit)
f = command(/opt/TGW/bin/tm ebay-title-search)
shift+s = command(/opt/TGW/bin/tm seller-hub)

# --- pipeline stages (in order 1–5) ---
1 = command(/opt/TGW/bin/tm identify)
2 = command(/opt/TGW/bin/tm draft)
3 = command(/opt/TGW/bin/tm price)
4 = command(/opt/TGW/bin/tm stage)
5 = command(/opt/TGW/bin/tm publish)
p = command(/opt/TGW/bin/tm publish)

# --- picklist ---
a = command(/opt/TGW/bin/tm picklist-add)
shift+a = command(/opt/TGW/bin/tm picklist-question)

# --- location bulk ---
m = command(/opt/TGW/bin/tm move-all)
shift+l = command(/opt/TGW/bin/tm location-view)

# --- admin / system ---
k = command(/opt/TGW/bin/tm health)
q = command(/opt/TGW/bin/tm queue)
c = command(/opt/TGW/bin/tm catalog)
d = command(/opt/TGW/bin/tm staged)
w = command(/opt/TGW/bin/tm weight)
y = command(/opt/TGW/bin/tm whisper)
z = command(/opt/TGW/bin/tm whisper-short)
x = command(/opt/TGW/bin/tm suggest)
r = command(/opt/TGW/bin/tm requeue-nodraft)

# --- pass-through: navigation/editing keys work normally ---
enter = enter
backspace = backspace
tab = tab
space = space
up = up
down = down
left = left
right = right
home = home
end = end
pageup = pageup
pagedown = pagedown
delete = delete
f1 = f1
f2 = f2
f3 = f3
f4 = f4
f5 = f5
f6 = f6
f7 = f7
f8 = f8
f9 = f9
f10 = f10
f11 = f11
f12 = f12
