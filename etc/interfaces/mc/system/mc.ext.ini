[mc.ext.ini]
Version=2.0

### TGW Virtual Filesystems ###

# SKU item JSON — enter tgwitem VFS (fields + photos)
[tgw-item-json]
Regex=tgw[0-9]+\.json$
Open=%cd %p/#tgwitem

# Catalog sentinel — enter tgwcatalog VFS (all items by location)
[tgw-catalog]
Shell=.tgwcat
Open=%cd %p/#tgwcatalog
View=%view{ascii} cat %p

# Queue sentinel — enter tgwqueue VFS (live PG queue)
[tgw-queue]
Shell=.tgwqueue
Open=%cd %p/#tgwqueue
View=%view{ascii} cat %p

# Health sentinel — enter tgwhealth VFS
[tgw-health]
Shell=.tgwhealth
Open=%cd %p/#tgwhealth
View=%view{ascii} cat %p

# Services sentinel — enter tgwservices VFS
[tgw-services]
Shell=.tgwsvc
Open=%cd %p/#tgwservices
View=%view{ascii} cat %p

# Logs sentinel — enter tgwlogs VFS (read-only journalctl per worker)
[tgw-logs]
Shell=.tgwlogs
Open=%cd %p/#tgwlogs
View=%view{ascii} cat %p

# Images — F3 renders inline with chafa; Enter opens gwenview
# Covers jpg/gif/png/webp/mp4 (the dominant TGW item media types)
[tgw-image]
Regex=\.(jpe?g|png|gif|webp|bmp|tiff?|avif|heic|heif|ico)$
RegexIgnoreCase=true
View=%view{ascii} /opt/TGW/mc/tgw-view-image.sh %f
Open=(/usr/bin/gwenview %f &) 2>/dev/null

# Video — F3 renders first-frame preview with chafa
[tgw-video]
Regex=\.(mp4|mov|mkv|webm|avi|m4v)$
RegexIgnoreCase=true
View=%view{ascii} /opt/TGW/mc/tgw-view-image.sh --animate=on --duration=5 %f
Open=(/usr/bin/gwenview %f &) 2>/dev/null

### End TGW ###

### GIT Repo ###
[gitfs changeset]
Regex=^\\[git\\]
Open=%cd %p/changesetfs://
View=%cd %p/patchsetfs://

