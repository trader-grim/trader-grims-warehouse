# Aider configuration for Trader Grim's Warehouse (TGW)
# Aider follows the exact approved standalone Plan packet supplied for a task.
#
# Usage (per-task):
#   git checkout -b task/<id>-<slug>
#   aider --message-file aider/spec-<id>.md <files...>
#
# Default model: DeepSeek V4 Flash, DIRECT API (Dave, 2026-07-15) — funded
#   direct DeepSeek key already exists (secrets_root/tgw.env DEEPSEEK_API_KEY,
#   same "deepseek-v4-flash" model id used by llm.py's deepseek_direct route).
#   Fast, cheap, good instruction-following in limited testing. Reserved for
#   the "busywork" tier: XS/S mechanical coding tasks, monitoring/schlepping/
#   merging — not architecture or eBay-invariant work (that stays Claude Code,
#   per the supplied packet's division of labor).
#   Requires: DEEPSEEK_API_KEY (loaded from /home/db/.env via env-file below
#   for interactive use, or from secrets_root via aider_mcp_server.py's
#   _load_api_keys() for the MCP-invoked path).
#
# One model, no architect split, no separate editor/weak model (Dave,
#   2026-07-15) — deepseek-v4-flash does its own edits directly.
#
# See aider/spec-<id>.md for the per-task run command including model override.

env-file: /home/db/.env

model: deepseek/deepseek-v4-flash

# Reasoning is a per-task dial, not a fixed structure (Dave, 2026-07-15): default
#   to non-thinking here since this tier is XS/S mechanical busywork — fast/cheap
#   is the point. A given spec-<id>.md can override reasoning_effort upward
#   (high/max) via --set-model-setting for a task that genuinely needs deeper
#   reasoning (tricky multi-file diff, subtle logic); don't hardcode a second
#   model/mode split for it. See DeepSeek's thinking-mode docs:
#   https://api-docs.deepseek.com/guides/thinking_mode
model-settings:
  deepseek/deepseek-v4-flash:
    extra_body:
      thinking:
        type: disabled

architect: false

cache-prompts: true
map-tokens: 65536                  # deepseek-v4-flash has a 1M context window — repo map
                                    # was capped at 16k for smaller-context models; raised
                                    # to take advantage of the headroom (Dave, 2026-07-15)

show-diffs: true
git: true
auto-commits: true                 # commits land on the task branch only; never merge yourself

auto-lint: true
auto-test: false
lint-cmd: "python: ruff check --select=E,F,W --ignore=E501 {files}"   # src/ only — avoid blocking on unrelated test/tools lint
test-cmd: "pytest -q"
cache-keepalive-pings: 2
