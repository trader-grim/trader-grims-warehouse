# Aider configuration for Trader Grim's Warehouse (TGW)
# See docs/TGW-Plan-Vault/plan/next-process.md §2 for context on the Aider tier.
#
# Usage (per-task):
#   git checkout -b task/<id>-<slug>
#   aider --message-file aider/spec-<id>.md <files...>
#
# Default model: Anthropic Sonnet (Python/backend tasks)
#   Requires: ANTHROPIC_API_KEY + hard billing cap in console.anthropic.com (~$40/mo)
#
# Flutter/Dart tasks: override with Gemini 3.1 Flash-Lite via OpenRouter (cheap, native Dart)
#   Requires: OPENROUTER_API_KEY (loaded from /home/tgw/.env via env-file above)
#   Override flag: --model openrouter/google/gemini-3.1-flash-lite
#   Pricing: ~$0.10/1M input (confirmed available on OpenRouter 2026-06-13)
#
# See aider/spec-<id>.md for the per-task run command including model override.

env-file: /home/tgw/.env

model: anthropic/claude-sonnet-4-6
weak-model: anthropic/claude-haiku-4-5-20251001

architect: true
auto-accept-architect: false       # review the plan before edits land

cache-prompts: true
map-tokens: 8000

show-diffs: true
git: true
auto-commits: true                 # commits land on the task branch only; never merge yourself

auto-lint: true
auto-test: true
lint-cmd: "python: ruff check ."
test-cmd: "pytest -q"
