[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-grims-warehouse"
version = "0.1.0"
description = "Inventory management platform for Trader Grim's Warehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "textual>=0.59",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
tgw             = "tgw.api:main"
tgw-browser     = "tgw.browser:main"
tgw-queue-launcher = "tgw.queue.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tgw.queue" = ["*.sql"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
