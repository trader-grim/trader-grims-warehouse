[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-grims-warehouse"
version = "0.1.0"
description = "Inventory management platform for Trader Grim's Warehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "textual>=0.59",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
thumbnails = [
    "Pillow>=10.0",
]

[project.scripts]
tgw                = "tgw.api:main"
tgw-browser        = "tgw.browser:main"
tgw-queue-launcher = "tgw.queue.launcher:main"
tgw-echo-worker           = "tgw.workers.echo:main"
tgw-token-worker          = "tgw.workers.token_refresh:main"
tgw-pm-intake-worker      = "tgw.workers.pm_intake:main"
tgw-bundle-intake-worker  = "tgw.workers.bundle_intake:main"
tgw-multi-intake-worker   = "tgw.workers.multi_intake:main"
tgw-catalog-rebuild-worker = "tgw.workers.catalog_rebuild:main"
tgw-thumbnail-gen-worker  = "tgw.workers.thumbnail_gen:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tgw.queue" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
fix = true

[tool.ruff.lint]
select = ["E", "F", "I"]
