[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-grims-warehouse"
version = "0.1.0"
description = "Inventory management platform for Trader Grim's Warehouse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "requests>=2.31",
    "pyncthing>=0.1",
    "textual>=0.59",
    "psycopg2-binary>=2.9",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
    "mcp>=1.0",
    "pyperclip>=1.8",
    "python-xlib>=0.33",
    "mistune>=3.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "Pillow>=10.0",   # so CI (.[dev]) runs the PP-VISION-001 fingerprint tests
]
thumbnails = [
    "Pillow>=10.0",
]
gemini = [
    "google-genai>=0.8",
]
printing = [
    "reportlab>=4.0",
    "qrcode[pil]>=7.4",
]
nats = [
    "nats-py>=2.7",
]

[project.scripts]
tgw                = "tgw.api:main"
tgw-coding         = "tgw.coding_cli:main"
tgw-mcp-server     = "tgw.mcp_server:main"
tgw-aider-mcp-server = "tgw.aider_mcp_server:main"
tgw-browser        = "tgw.browser:main"
tgw-queue-launcher = "tgw.queue.launcher:main"
tgw-echo-worker           = "tgw.workers.echo:main"
tgw-token-worker          = "tgw.workers.token_refresh:main"
tgw-pm-intake-worker      = "tgw.workers.pm_intake:main"
tgw-bundle-intake-worker  = "tgw.workers.bundle_intake:main"
tgw-ai-identify-worker    = "tgw.workers.ai_identify:main"
tgw-ebay-draft-worker     = "tgw.workers.ebay_draft:main"
tgw-ebay-upload-worker    = "tgw.workers.ebay_upload:main"
tgw-ebay-price-worker     = "tgw.workers.ebay_price:main"
tgw-ebay-stage-worker        = "tgw.workers.ebay_stage:main"
tgw-ebay-legacy-sync-worker  = "tgw.workers.ebay_legacy_sync:main"
tgw-ebay-publish-worker   = "tgw.workers.ebay_publish:main"
tgw-ebay-dole-worker      = "tgw.workers.ebay_dole:main"
tgw-ebay-price-reducer-worker = "tgw.workers.ebay_price_reducer:main"
tgw-velocity-stats-worker     = "tgw.workers.velocity_stats:main"
tgw-ebay-sync-worker      = "tgw.workers.ebay_sync:main"
tgw-ebay-repush-worker    = "tgw.workers.ebay_repush:main"
tgw-ebay-sku-migrate-worker = "tgw.workers.ebay_sku_migrate:main"
tgw-clipd              = "tgw.clipd:main"
tgw-multi-intake-worker   = "tgw.workers.multi_intake:main"
tgw-catalog-rebuild-worker = "tgw.workers.catalog_rebuild:main"
tgw-plan-render-worker    = "tgw.workers.plan_render:main"
tgw-thumbnail-gen-worker      = "tgw.workers.thumbnail_gen:main"
tgw-alt-text-worker           = "tgw.workers.alt_text:main"
tgw-sync-conflict-worker      = "tgw.workers.sync_conflict:main"
tgw-normalize-condition-worker = "tgw.workers.normalize_condition:main"
tgw-workflow-evaluate-worker = "tgw.workers.workflow_evaluate:main"
tgw-coding-worker             = "tgw.workers.coding:main"
tgw-coding-provision-worker   = "tgw.coding_provision_worker:main"
tgw-codex-implement-worker    = "tgw.workers.coding:codex_implement_main"
tgw-claude-review-worker      = "tgw.workers.coding:claude_review_main"
tgw-controller-verify-worker  = "tgw.workers.coding:controller_verify_main"
tgw-controller-verify-runner  = "tgw.workers.controller_verify:main"
tgw-hermes-stitch-worker      = "tgw.workers.coding:hermes_stitch_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tgw.queue" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["nix", ".git", "__pycache__", "*.egg-info", "systemd"]
# todo #1361: cache_dir MUST stay outside any worktree. tgw-coder worktrees
# are sometimes run under `sudo -u tgw` and sometimes as `db` -- pytest
# creates .pytest_cache/ owned by whichever user ran it, and a later
# other-user `rm -rf` on the worktree then needs sudo to clean it up.
# $HOME expands per-invoking-user (pytest's resolve_from_str() calls
# os.path.expandvars()), so tgw and db each get their own cache under
# their own home and never write into the worktree tree at all.
cache_dir = "$HOME/.cache/tgw-pytest"

[tool.ruff]
line-length = 200
# fix-on-check removed 2026-06-11 (session 24): a bare `ruff check` must never
# mutate the tree — it silently rewrote 8 unrelated files during an agent
# session. Apply fixes explicitly with `ruff check --fix` when you mean it.
# systemd/history/ is an archive of dead scripts — not lint-gated.
exclude = ["systemd/history", "tools/archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# http_server.py contains inline minified JS blobs — E501 is not actionable there
"src/tgw/http_server.py" = ["E501"]
